<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quartermaster</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563d9'/%3E%3Cstop offset='1' stop-color='%237c5cf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 16.5l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before the page paints, so it never flashes the wrong one.
    try { const t = localStorage.getItem("qm.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Main">
      <a class="brand" href="#/">
        <span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span>Quartermaster<small>Oracle Fusion testing</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="side-scrim" id="side-scrim"></div>
    <div class="main">
      <header class="top">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="grow"></div>
        <button class="search-btn" id="search-btn" aria-label="Search and go (Ctrl+K)"></button>
        <button class="icon-btn" id="theme-btn" aria-label="Switch light or dark"></button>
        <button class="btn primary new-run" id="new-run-btn"></button>
      </header>
      <main class="content" id="main"></main>
    </div>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
