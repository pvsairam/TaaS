name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,ai,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Point the browser tests at the installed Chromium
        run: |
          echo "QM_CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
